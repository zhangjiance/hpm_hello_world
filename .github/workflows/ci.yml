name: ci

# Build the hello-world application for every supported board (each *-release
# preset in CMakePresets.json), on push/PR and on demand.  The board list is
# read from CMakePresets.json, so adding a preset automatically adds a CI leg.
#
# What CI has to provide, because none of it is in the repository:
#   - the HPM SDK source tree, located through HPM_SDK_BASE
#   - the riscv-none-elf toolchain, located through GNURISCV_TOOLCHAIN_PATH
# Both externals are pinned below to the versions this project is built and
# tested with, so a CI run is reproducible instead of following a moving branch.

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HPM_SDK_REPO: https://github.com/hpmicro/hpm_sdk.git
  HPM_SDK_TAG: v1.13.0
  HPM_SDK_SHA: ccc5ec467a047f3ea85cd2fa4565e91db7135a38
  XT_VERSION: 15.2.0-1
  XT_DIR: xpack-riscv-none-elf-gcc-15.2.0-1

jobs:
  presets:
    name: collect board presets
    runs-on: ubuntu-latest
    outputs:
      presets: ${{ steps.list.outputs.presets }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: List every release preset
        id: list
        run: |
          set -euo pipefail
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          with open("CMakePresets.json") as f:
              presets = [
                  p["name"] for p in json.load(f)["configurePresets"]
                  if p["name"].endswith("-release")
              ]
          print("presets=" + json.dumps(presets))
          PY

  build:
    name: build ${{ matrix.preset }}
    needs: presets
    runs-on: ubuntu-latest
    strategy:
      # report every preset, not just the first failure
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.presets.outputs.presets) }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Restore the RISC-V toolchain
        id: xt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/${{ env.XT_DIR }}
          key: xt-${{ env.XT_VERSION }}-linux-x64

      - name: Install the RISC-V toolchain
        if: steps.xt.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          dest="${{ runner.temp }}/${XT_DIR}"
          # --retry: these are two large downloads from a shared CDN
          url=$(curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 \
            "https://api.github.com/repos/xpack-dev-tools/riscv-none-elf-gcc-xpack/releases/tags/v${XT_VERSION}" \
            | jq -r '.assets[].browser_download_url' | grep -m1 'linux-x64.tar.gz$')
          echo "downloading $url"
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 5 "$url" \
            | tar -xz -C "${{ runner.temp }}"
          test -x "$dest/bin/riscv-none-elf-gcc"
          "$dest/bin/riscv-none-elf-gcc" --version | head -1

      - name: Restore the HPM SDK
        id: sdk
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/hpm_sdk
          key: hpm-sdk-${{ env.HPM_SDK_SHA }}

      - name: Fetch the HPM SDK (pinned to ${{ env.HPM_SDK_TAG }})
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "${HPM_SDK_TAG}" \
            "${HPM_SDK_REPO}" "${{ runner.temp }}/hpm_sdk"
          # the tag must still point at the commit this project was built against
          test "$(git -C "${{ runner.temp }}/hpm_sdk" rev-parse HEAD)" = "${HPM_SDK_SHA}"

      - name: Configure and build
        env:
          HPM_SDK_BASE: ${{ runner.temp }}/hpm_sdk
          GNURISCV_TOOLCHAIN_PATH: ${{ runner.temp }}/${{ env.XT_DIR }}
        run: |
          set -euo pipefail
          echo "${GNURISCV_TOOLCHAIN_PATH}/bin" >> "$GITHUB_PATH"
          cmake --version | head -1
          ninja --version

          cmake --preset "${{ matrix.preset }}"
          cmake --build --preset "${{ matrix.preset }}" 2>&1 | tee build.log

          # Project sources have to stay warning clean.  Code this project does
          # not own (the SDK) is excluded.
          if grep -E "warning:" build.log | grep -vE "hpm_sdk/"; then
            echo "::error::compiler warnings in the project sources"
            exit 1
          fi

      - name: Upload the images
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.preset }}
          if-no-files-found: error
          path: |
            build/${{ matrix.preset }}/output/*.elf
            build/${{ matrix.preset }}/output/*.bin
            build/${{ matrix.preset }}/output/*.hex
            build/${{ matrix.preset }}/output/*.map

  release:
    name: publish ${{ github.ref_name }}
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download the images
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the release files
        run: |
          set -euo pipefail
          # Only the flashable .bin is published.
          for dir in artifacts/*/; do
            bin=$(find "${dir}" -maxdepth 1 -name 'hpm_hello_world-*.bin' -print -quit)
            test -n "${bin}"
            cp "${bin}" .
          done
          sha256sum hpm_hello_world-*.bin > sha256sums.txt
          cat sha256sums.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pre=""
          case "${TAG}" in
            *-rc*|*-beta*|*-alpha*) pre="--prerelease" ;;
          esac
          files=(hpm_hello_world-*.bin sha256sums.txt)

          # GitHub answers 5xx and timeouts from time to time; retry those
          # instead of failing a release that is otherwise fine.
          retry() {
            local attempt=1
            until "$@"; do
              if [ "${attempt}" -ge 3 ]; then
                echo "::error::$1 failed ${attempt} times"
                return 1
              fi
              sleep $((attempt * 10))
              attempt=$((attempt + 1))
            done
          }

          # Idempotent on purpose: re-pushing the same tag must update assets.
          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "release ${TAG} already exists, making sure the assets are there"
            expected=" ${files[*]} "
            gh release view "${TAG}" --json assets --jq '.assets[].name' |
              while read -r name; do
                case "${name}" in hpm_hello_world-*) ;; *) continue ;; esac
                case "${expected}" in
                  *" ${name} "*) ;;
                  *) retry gh release delete-asset "${TAG}" "${name}" -y ;;
                esac
              done
            retry gh release upload "${TAG}" "${files[@]}" --clobber
          else
            retry gh release create "${TAG}" \
              --title "${TAG}" \
              --generate-notes ${pre} \
              "${files[@]}"
          fi

          # A tag deleted/recreated by hand can leave a draft release; publish it.
          retry gh release edit "${TAG}" --draft=false

          retry gh release view "${TAG}" \
            --json tagName,isPrerelease,assets \
            --jq '"\(.tagName) prerelease=\(.isPrerelease) assets=\([.assets[].name] | join(", "))"'
